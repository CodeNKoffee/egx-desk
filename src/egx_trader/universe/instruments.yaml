# GENERATED SEED — hand-edit from here on; do not regenerate over local changes.
#
# `sharia` is a THREE-state field, not a boolean: compliant | non_compliant | unknown.
# A boolean would force a guess for names we have no labelling for, and a wrong
# "compliant" is the one error this system must never make. `unknown` is excluded
# from the sharia universe, exactly like non_compliant.
#
# Fields left absent are genuinely unknown and must not be inferred:
#   sector, board, lot_size, tick_size, price_limit_pct
# `board` in particular gates T+0 eligibility (Most Active / Moderate / Tamayuz).
# Absent board => not T+0 eligible, because unknown must never read as permissive.
#
# Provenance:
#   compliant / non_compliant  -> curated from the May 2026 index base
#   isin, name_ar              -> EGX Shariah Index May 2026.xlsx (34 of these rows)
#   index_weight               -> EGX_BASE where published, else the xlsx weight x100
#
# Sharia labelling is AGGREGATED from Thndr's app. We do not certify compliance.

