# EGX non-trading days and special session hours.
#
# ─────────────────────────────────────────────────────────────────────────────
# HOW THIS FILE WAS BUILT, AND WHY IT IS NOT A LIST OF EGYPTIAN PUBLIC HOLIDAYS.
#
# The exchange's calendar and the country's public holidays are NOT the same
# list, and assuming they were produced real bugs. Measured against the trading
# record: EGX was OPEN on 2026-01-25 (Police Day, 75% of liquid names traded)
# and on 2026-06-30 (June 30 Revolution, 56%) — yet CLOSED on both of those
# dates in 2024. The same nominal holiday is a trading day in one year and not
# the next, so no rule derived from the public-holiday list can be correct.
#
# These dates are therefore DERIVED FROM EVIDENCE, not from a holiday list: a
# date is recorded closed when ZERO of 16 index-weighted, liquid EGX names have
# a bar for it. The feed loses roughly 22-30% of sessions at random, so a single
# name missing a day means nothing — but all 16 missing the same day essentially
# never happens by chance. Rebuild or extend with `egx verify-calendar`.
#
# The derived set lands exactly on Eid al-Fitr, Eid al-Adha, Coptic Christmas,
# Sham El-Nessim, Mawlid and Islamic New Year across four years, which is the
# cross-check that this method works. Where a date maps unambiguously onto a
# known observance it is named; where it does not, it stays generic rather than
# inventing a name for it.
#
# CONFIDENCE: this is inferred from a lossy third-party feed, not read from an
# exchange publication. Reconcile against EGX's own published calendar when you
# can get it. Past `verified_through`, strict lookups raise rather than guess,
# because a missing holiday corrupts settlement dates and makes the system
# believe an unsettled lot is sellable.
# ─────────────────────────────────────────────────────────────────────────────

